# Stack pra Docker Swarm, ligada a este repositorio (Portainer > Stacks > Add
# stack > Repository, com "Automatic updates" ligado).
#
# Publicacao automatica:
#   1. push na main
#   2. o GitHub Actions (.github/workflows/publicar.yml) gera a imagem, publica
#      em ghcr.io/junioalvesdev/transporte-app e troca a tag da linha
#      "image:" abaixo, num commit dele
#   3. o Portainer ve o commit novo e atualiza a stack sozinho, sem queda
# NAO edite a linha "image:" na mao: quem cuida dela e o workflow.
#
# Variaveis (Portainer > "Environment variables" da stack):
#   DB_PASSWORD, DB_ROOT_PASSWORD  - obrigatorias, senhas do MySQL
#   LDAP_URL, LDAP_DOMINIO         - Active Directory
#   SMTP_HOST, SMTP_USER, SMTP_PASSWORD - envio de e-mail (opcional)

services:
  backend:
    image: ghcr.io/junioalvesdev/transporte-app:1.1
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: transportes
      DB_USER: transportes
      DB_PASSWORD: ${DB_PASSWORD}
      LDAP_URL: ${LDAP_URL}
      LDAP_DOMINIO: ${LDAP_DOMINIO}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # login de teste admin/admin: sempre desligado em producao
      AUTH_TESTE_HABILITADO: "false"
      # mesmo historico do Flyway do banco que ja esta no servidor
      SPRING_FLYWAY_LOCATIONS: filesystem:./db-migration-historico-completo,filesystem:./db-legado-privado
    # sem "ports": o acesso e pelo Traefik (https://transportes.ovg.org.br)
    networks:
      - network
      - traefik_proxy
    # "pronto" = ja aceita conexao na 8080 (o Spring so abre a porta depois
    # de subir e rodar as migrations). start_period da folga pra subida lenta.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      # sem placement: a imagem vem do ghcr, qualquer no consegue baixar
      # atualizacao sem queda: sobe o container novo, espera o healthcheck
      # passar e so entao desliga o antigo. Se o novo nao ficar saudavel,
      # volta sozinho pra versao anterior.
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: start-first
      # sem depends_on no Swarm: se subir antes do MySQL aceitar conexao,
      # cai e o Swarm sobe de novo ate o banco estar pronto
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_proxy"
        - "traefik.http.routers.transportes.rule=Host(`transportes.ovg.org.br`)"
        - "traefik.http.routers.transportes.entrypoints=websecure"
        - "traefik.http.routers.transportes.tls=true"
        - "traefik.http.services.transportes.loadbalancer.server.port=8080"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: transportes
      MYSQL_USER: transportes
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - transportes_db_data:/var/lib/mysql
    networks:
      - network
    deploy:
      # o volume do banco fica no disco de um no so — o MySQL precisa voltar
      # sempre nesse mesmo no, senao sobe com um volume novo e vazio
      placement:
        constraints:
          - node.hostname == lnx-portainer-manager1
      restart_policy:
        condition: on-failure

networks:
  network:
    driver: overlay
    attachable: true
  traefik_proxy:
    external: true

volumes:
  transportes_db_data:
    # nome fixo = o volume criado pela stack antiga "transporte". Assim a
    # stack nova usa o banco que ja existe, seja qual for o nome dela.
    external: true
    name: transporte_transportes_db_data
