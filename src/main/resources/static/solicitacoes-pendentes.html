<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitacoes pendentes - Departamento de Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-ovg navbar-dark mb-4">
        <div class="container" id="nav-admin-container"></div>
    </nav>

    <main class="container pb-5">
        <div class="d-flex align-items-center gap-2 mb-3">
            <h1 class="h5 mb-0">Solicitacoes pendentes</h1>
            <span class="badge rounded-pill text-bg-success"><i class="bi bi-arrow-repeat me-1"></i>Auto-refresh</span>
        </div>
        <div id="lista-solicitacoes"></div>
        <p id="mensagem-vazio" class="text-muted d-none">Nenhuma solicitacao pendente no momento.</p>
        <div id="paginacao-solicitacoes"></div>
    </main>

    <!-- Modal de aprovacao: cria uma viagem nova (rota simples origem -> destino) e vincula a solicitacao -->
    <div class="modal fade" id="modal-aprovar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Aprovar solicitacao</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-aprovar">
                    <div class="modal-body row g-3">
                        <div class="col-12">
                            <label class="form-label" for="select-tipo-veiculo-aprovar">Tipo de veiculo</label>
                            <select id="select-tipo-veiculo-aprovar" class="form-select"></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="select-veiculo">Veiculo</label>
                            <select id="select-veiculo" class="form-select" required></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="select-motorista">Motorista</label>
                            <select id="select-motorista" class="form-select" required></select>
                        </div>
                        <div class="col-12" id="campo-input-saida"></div>
                        <div class="col-12" id="campo-input-chegada"></div>
                        <div id="mensagem-erro-aprovar" class="text-danger small d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-ovg-principal">Confirmar aprovacao</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-reprovar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reprovar solicitacao</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-reprovar">
                    <div class="modal-body">
                        <label class="form-label" for="input-motivo-recusa">Motivo da recusa</label>
                        <textarea id="input-motivo-recusa" class="form-control" rows="3" maxlength="500" required></textarea>
                        <div id="mensagem-erro-reprovar" class="text-danger small mt-2 d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-ovg-principal">Confirmar recusa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/data-picker.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/nav-admin.js"></script>
    <script src="js/solicitacoes-pendentes.js"></script>
</body>
</html>
