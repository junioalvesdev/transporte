<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - Departamento de Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
    <link href="css/calendario.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-ovg navbar-dark mb-4">
        <div class="container" id="nav-admin-container"></div>
    </nav>

    <main class="container pb-5">
        <div class="calendario-cabecalho">
            <div class="calendario-cabecalho-esquerda">
                <div class="calendario-icone">OVG</div>
                <div class="calendario-nav">
                    <button class="botao-nav-circular" id="botao-anterior">&lsaquo;</button>
                    <button class="botao-nav-circular" id="botao-proximo">&rsaquo;</button>
                </div>
                <button class="botao-hoje" id="botao-hoje">Hoje</button>
                <h1 class="calendario-titulo" id="titulo-periodo">Calendario</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-ovg-principal btn-sm" id="botao-ordem-trafego">Gerar Ordem de Trafego</button>
                <div class="calendario-modo btn-group btn-group-sm">
                    <button class="btn btn-ovg-secundario" id="botao-semana">Semana</button>
                    <button class="btn btn-ovg-secundario ativo" id="botao-mes">Mes</button>
                </div>
            </div>
        </div>

        <div class="calendario-container">
            <div id="visao-semana" class="d-none">
                <div class="mes-cabecalho-dias" id="semana-cabecalhos"></div>
                <div id="visao-semana-grade" class="semana-grade"></div>
            </div>
            <div id="visao-mes">
                <div class="mes-cabecalho-dias" id="mes-cabecalhos"></div>
                <div id="visao-mes-grade" class="mes-grade"></div>
            </div>
        </div>

        <div class="d-flex gap-3 flex-wrap small text-muted">
            <span><span class="evento-pilula cor-planejada">&nbsp;&nbsp;</span> Planejada</span>
            <span><span class="evento-pilula cor-aberta">&nbsp;&nbsp;</span> Aberta p/ aproveitamento</span>
            <span><span class="evento-pilula cor-lotada">&nbsp;&nbsp;</span> Lotada</span>
            <span><span class="evento-pilula cor-andamento">&nbsp;&nbsp;</span> Em andamento</span>
            <span><span class="evento-pilula cor-concluida">&nbsp;&nbsp;</span> Concluida</span>
            <span><span class="evento-pilula cor-cancelada">&nbsp;&nbsp;</span> Cancelada</span>
        </div>
    </main>

    <!-- Lista de viagens do dia (clique em "+N mais"): mostra tudo dentro do proprio modal, sem trocar de tela -->
    <div class="modal fade" id="modal-eventos-dia" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-eventos-dia">Viagens do dia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="lista-eventos-dia" class="d-flex flex-column gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detalhe da viagem em modal: evita criar uma tela separada so pra ver/editar uma viagem -->
    <div class="modal fade" id="modal-detalhe-viagem" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalhes da viagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <dl class="row mb-0">
                        <dt class="col-5">Solicitado por</dt><dd class="col-7" id="detalhe-solicitantes"></dd>
                        <dt class="col-5">Status atual</dt><dd class="col-7" id="detalhe-status"></dd>
                    </dl>

                    <div id="detalhe-viagem-passada" class="alert alert-secondary small mb-0 d-none">
                        Esta viagem ja ocorreu e nao pode mais ser alterada.
                    </div>

                    <form id="form-detalhe-viagem" class="row g-3 mt-1">
                        <div class="col-12">
                            <label class="form-label" for="select-editar-veiculo">Veiculo</label>
                            <select id="select-editar-veiculo" class="form-select" required></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="select-editar-motorista">Motorista</label>
                            <select id="select-editar-motorista" class="form-select" required></select>
                        </div>
                        <div class="col-12" id="campo-input-editar-saida"></div>
                        <div class="col-12" id="campo-input-editar-retorno"></div>
                        <div class="col-12">
                            <label class="form-label" for="input-editar-capacidade">Capacidade (ocupacao atual: <span id="detalhe-ocupacao-atual"></span>)</label>
                            <input id="input-editar-capacidade" type="number" min="1" class="form-control" required>
                        </div>
                        <div id="mensagem-erro-detalhe" class="text-danger small d-none"></div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-ovg-principal">Salvar alteracoes</button>
                            <button type="button" class="btn btn-ovg-secundario" id="botao-ordem-trafego-viagem">Gerar Ordem de Trafego</button>
                        </div>
                    </form>

                    <hr>
                    <div id="secao-status">
                        <label class="form-label" for="select-novo-status">Mudar status para</label>
                        <div class="d-flex gap-2">
                            <select id="select-novo-status" class="form-select"></select>
                            <button class="btn btn-ovg-secundario" id="botao-salvar-status">Salvar</button>
                        </div>
                        <div id="mensagem-erro-status" class="text-danger small mt-2 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ordem de Trafego: pode ser aberta em branco (botao do cabecalho) ou pre-preenchida a partir de uma viagem -->
    <div class="modal fade" id="modal-ordem-trafego" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Gerar Ordem de Trafego</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-ordem-trafego">
                    <div class="modal-body row g-3">
                        <div class="col-12">
                            <label class="form-label" for="select-ordem-veiculo">Veiculo</label>
                            <select id="select-ordem-veiculo" class="form-select" required></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="select-ordem-motorista">Motorista</label>
                            <select id="select-ordem-motorista" class="form-select" required></select>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="input-ordem-data">Data</label>
                            <input id="input-ordem-data" type="date" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="input-ordem-data-fim">Data final (opcional)</label>
                            <input id="input-ordem-data-fim" type="date" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="select-ordem-unidade">Unidade</label>
                            <select id="select-ordem-unidade" class="form-select" required></select>
                        </div>
                        <div id="mensagem-erro-ordem" class="text-danger small d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-ovg-principal">Gerar PDF</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/data-picker.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/nav-admin.js"></script>
    <script src="js/ordem-trafego.js"></script>
    <script src="js/calendario.js"></script>
</body>
</html>
