<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorios - Departamento de Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-ovg navbar-dark mb-4">
        <div class="container" id="nav-admin-container"></div>
    </nav>

    <main class="container pb-5">
        <h1 class="h5 mb-3">Relatorios</h1>

        <div class="cartao cartao-busca mb-4">
            <form id="form-filtro" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="data-inicio">De</label>
                    <input id="data-inicio" type="date" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="data-fim">Ate</label>
                    <input id="data-fim" type="date" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-ovg-principal w-100">Gerar</button>
                </div>
            </form>
        </div>

        <p class="h6">Total de viagens no periodo: <span id="total-viagens">-</span></p>

        <div class="row g-4 mt-1">
            <div class="col-md-6">
                <div class="cartao p-3">
                    <h2 class="h6">Viagens por mes</h2>
                    <canvas id="grafico-por-mes" height="180"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="cartao p-3">
                    <h2 class="h6">Viagens por status</h2>
                    <table class="table table-sm mb-0">
                        <tbody id="tabela-status"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-6">
                <div class="cartao p-3">
                    <h2 class="h6">Viagens por motorista</h2>
                    <table class="table table-sm mb-0">
                        <tbody id="tabela-motorista"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-6">
                <div class="cartao p-3">
                    <h2 class="h6">Viagens por tipo de veiculo</h2>
                    <table class="table table-sm mb-0">
                        <tbody id="tabela-tipo-veiculo"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav-admin.js"></script>
    <script src="js/relatorios.js"></script>
</body>
</html>
