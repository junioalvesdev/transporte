<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Central de Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
    <main class="container" style="max-width: 380px;">
        <div class="cartao cartao-busca">
            <h1 class="h5 mb-3 text-center">Central de Transportes</h1>
            <div class="btn-group btn-group-sm w-100 mb-3" id="grupo-modo-login">
                <button type="button" class="btn btn-ovg-secundario ativo" data-modo="ldap">LDAP</button>
                <button type="button" class="btn btn-ovg-secundario" data-modo="normal">Normal (teste)</button>
            </div>
            <p class="text-muted small text-center mb-4" id="texto-modo-login">Entre com seu usuario de rede (o mesmo do computador)</p>
            <form id="form-login">
                <div class="mb-3">
                    <label class="form-label" for="login">Usuario</label>
                    <input id="login" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="senha">Senha</label>
                    <input id="senha" type="password" class="form-control" required>
                </div>
                <div id="mensagem-erro" class="text-danger small mb-3 d-none"></div>
                <button type="submit" class="btn btn-ovg-principal w-100">Entrar</button>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // "Normal" so funciona se o backend tiver a flag de teste ligada (ver
        // TesteAuthenticationProvider) — aqui e so um atalho pra preencher os
        // campos, a validacao de verdade e sempre no servidor.
        document.querySelectorAll('#grupo-modo-login [data-modo]').forEach((botao) => {
            botao.addEventListener("click", () => {
                document.querySelectorAll('#grupo-modo-login [data-modo]').forEach((b) => b.classList.remove("ativo"));
                botao.classList.add("ativo");
                const campoLogin = document.getElementById("login");
                const campoSenha = document.getElementById("senha");
                if (botao.dataset.modo === "normal") {
                    document.getElementById("texto-modo-login").textContent =
                        "Login de teste (precisa estar habilitado no servidor)";
                    campoLogin.value = "admin";
                    campoSenha.value = "admin";
                } else {
                    document.getElementById("texto-modo-login").textContent =
                        "Entre com seu usuario de rede (o mesmo do computador)";
                    campoLogin.value = "";
                    campoSenha.value = "";
                }
            });
        });

        document.getElementById("form-login").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            const mensagemErro = document.getElementById("mensagem-erro");
            mensagemErro.classList.add("d-none");

            try {
                await Api.post("/api/auth/login", {
                    login: document.getElementById("login").value,
                    senha: document.getElementById("senha").value,
                });
                window.location.href = "index.html";
            } catch (erro) {
                mensagemErro.textContent = "Usuario ou senha invalidos.";
                mensagemErro.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
