<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Transportes - OVG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-ovg navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Central de Transportes &middot; OVG</span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-light" data-bs-toggle="modal" data-bs-target="#modal-nova-solicitacao">+ Nova solicitacao</button>
                <a href="admin.html" class="btn btn-sm btn-outline-light">Area do Departamento</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <ul class="nav nav-tabs mb-4" id="abas-central">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#aba-buscar" type="button">Buscar viagens</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#aba-minhas" type="button" id="botao-aba-minhas">Minhas solicitacoes</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="aba-buscar">
                <div class="cartao cartao-busca mb-4">
                    <h1 class="h5 mb-3">Pesquisar transporte</h1>
                    <form id="form-busca-viagem" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label" for="data-busca">Data</label>
                            <input id="data-busca" type="date" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="qtd-passageiros">Passageiros</label>
                            <input id="qtd-passageiros" type="number" min="1" value="1" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-ovg-principal w-100">Buscar</button>
                        </div>
                    </form>
                </div>

                <h2 class="h6 text-muted mb-3">Viagens encontradas</h2>
                <div id="lista-resultados"></div>
                <p id="mensagem-sem-resultados" class="text-muted d-none">
                    Nenhuma viagem disponivel nesse dia. Voce pode
                    <button type="button" class="btn btn-link p-0 align-baseline" data-bs-toggle="modal" data-bs-target="#modal-nova-solicitacao">criar uma nova solicitacao de transporte</button>.
                </p>
            </div>

            <div class="tab-pane fade" id="aba-minhas">
                <div id="lista-minhas-solicitacoes"></div>
                <div id="paginacao-minhas-solicitacoes"></div>
            </div>
        </div>
    </main>

    <!-- Modal "Nova solicitacao": acessivel de qualquer aba, sem navegar pra outra pagina -->
    <div class="modal fade" id="modal-nova-solicitacao" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Solicitar transporte</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-solicitacao">
                    <div class="modal-body row g-3">
                        <div class="col-12">
                            <label class="form-label" for="finalidade">Finalidade</label>
                            <input id="finalidade" class="form-control" maxlength="200" required>
                        </div>
                        <div class="col-12" id="seletor-origem"></div>
                        <div class="col-12" id="seletor-destino"></div>
                        <div class="col-12" id="campo-data-hora"></div>
                        <div class="col-12" id="campo-data-hora-retorno"></div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="replicar-outros-dias">
                                <label class="form-check-label" for="replicar-outros-dias">Deseja replicar esta viagem para outros dias?</label>
                            </div>
                            <div id="campo-dias-replicados" class="d-none mt-2 cartao p-3">
                                <label class="form-label">Escolha os outros dias e o horario de saida</label>
                                <div id="calendario-dias-replicados"></div>
                                <button type="button" class="btn btn-ovg-principal w-100 mt-3" id="botao-confirmar-dias-replicados">
                                    Confirmar dias selecionados
                                </button>
                                <div id="resumo-dias-replicados" class="d-none alert alert-success mb-0 mt-2 small"></div>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="qtd-passageiros-solicitacao">Quantidade de passageiros</label>
                            <input id="qtd-passageiros-solicitacao" type="number" min="1" value="1" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="telefone-contato">Telefone de contato</label>
                            <input id="telefone-contato" type="tel" class="form-control" maxlength="20" placeholder="(62) 90000-0000" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="observacoes">Observacoes</label>
                            <textarea id="observacoes" class="form-control" rows="3" maxlength="500"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="concordo-disponibilidade" required>
                                <label class="form-check-label small" for="concordo-disponibilidade">
                                    Concordo em aguardar a disponibilidade da minha reserva. Sua reserva sera avaliada pelo
                                    departamento de CALT - (Coordenacao de Logistica e Transporte) e avisado em seu e-mail
                                    ou atraves deste sistema caso haja disponibilidade ou nao.
                                </label>
                            </div>
                        </div>
                        <div id="mensagem-erro-solicitacao" class="text-danger small d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-ovg-principal">Enviar solicitacao</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/data-picker.js"></script>
    <script src="js/seletor-local.js"></script>
    <script src="js/central.js"></script>
    <script src="js/minhas-solicitacoes.js"></script>
    <script src="js/nova-solicitacao.js"></script>
</body>
</html>
