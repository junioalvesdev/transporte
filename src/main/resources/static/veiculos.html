<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veiculos - Departamento de Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-ovg navbar-dark mb-4">
        <div class="container" id="nav-admin-container"></div>
    </nav>

    <main class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 mb-0">Veiculos</h1>
            <button class="btn btn-ovg-principal btn-sm" id="botao-novo-veiculo">Novo veiculo</button>
        </div>

        <table class="table cartao align-middle">
            <thead>
                <tr><th>Placa</th><th>Modelo</th><th>Capacidade</th><th>Tipo</th><th></th></tr>
            </thead>
            <tbody id="tabela-veiculos"></tbody>
        </table>
        <div id="paginacao-veiculos"></div>
    </main>

    <div class="modal fade" id="modal-veiculo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-veiculo">Novo veiculo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-veiculo">
                    <input type="hidden" id="editando-id-veiculo">
                    <div class="modal-body row g-3">
                        <div class="col-6">
                            <label class="form-label" for="input-placa">Placa</label>
                            <input id="input-placa" class="form-control" maxlength="10" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="input-capacidade">Capacidade</label>
                            <input id="input-capacidade" type="number" min="1" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="input-modelo">Modelo</label>
                            <input id="input-modelo" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="select-tipo-veiculo">Tipo</label>
                            <select id="select-tipo-veiculo" class="form-select" required></select>
                        </div>
                        <div id="mensagem-erro-veiculo" class="text-danger small d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-ovg-principal" id="botao-salvar-veiculo">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/nav-admin.js"></script>
    <script src="js/veiculos.js"></script>
</body>
</html>
