<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoristas - Departamento de Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-ovg navbar-dark mb-4">
        <div class="container" id="nav-admin-container"></div>
    </nav>

    <main class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 mb-0">Motoristas</h1>
            <button class="btn btn-ovg-principal btn-sm" id="botao-novo-motorista">Novo motorista</button>
        </div>

        <table class="table cartao align-middle">
            <thead>
                <tr><th>Nome</th><th>Telefone</th><th></th></tr>
            </thead>
            <tbody id="tabela-motoristas"></tbody>
        </table>
        <div id="paginacao-motoristas"></div>
    </main>

    <div class="modal fade" id="modal-motorista" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-motorista">Novo motorista</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-motorista">
                    <input type="hidden" id="editando-id-motorista">
                    <div class="modal-body row g-3">
                        <div class="col-12">
                            <label class="form-label" for="input-nome">Nome</label>
                            <input id="input-nome" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="input-telefone">Telefone</label>
                            <input id="input-telefone" class="form-control">
                        </div>
                        <div id="mensagem-erro-motorista" class="text-danger small d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-ovg-principal" id="botao-salvar-motorista">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/guard-transporte.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav-admin.js"></script>
    <script src="js/motoristas.js"></script>
</body>
</html>
