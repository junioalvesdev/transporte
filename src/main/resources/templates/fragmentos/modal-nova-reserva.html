<!-- Modal "Criar Reservas", usado na Lista de Reservas e no Calendario.
     form = FormNovaReservaDTO (montado pelo NovaReservaService).
     Se o envio der erro, o servidor devolve a pagina com este modal ja aberto
     e com o que foi digitado; nesse caso o fechar e um link de volta pra tela.
     Uso: th:replace="~{fragmentos/modal-nova-reserva :: modal(PAGINA.formNovaReserva)}" -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="modal(form)">
    <div id="modal-nova-reserva" th:class="${form.classeModal}" tabindex="-1">
        <div class="modal-dialog modal-dialog-scrollable">
            <form class="modal-content" method="post" th:action="${form.acao}">
                <input type="hidden" name="filtros" th:value="${form.filtros}">

                <div class="modal-header">
                    <h5 class="modal-title">Solicitar transporte</h5>
                    <button th:unless="${form.aberto}" type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    <a th:if="${form.aberto}" th:href="${form.urlFechar}" class="btn-close" aria-label="Fechar"></a>
                </div>

                <div class="modal-body row g-3">
                    <div th:if="${form.erro}" class="col-12">
                        <div class="alert alert-danger small mb-0" th:text="${form.erro}"></div>
                    </div>

                    <label class="col-12">
                        <span class="form-label d-block">Finalidade</span>
                        <input name="finalidade" class="form-control" maxlength="200" required th:value="${form.finalidade}">
                    </label>

                    <!-- Origem/destino: unidade da OVG OU "outro local" (cidade + descricao).
                         Os campos de cidade somem via CSS (:has) quando uma unidade e escolhida. -->
                    <div class="col-12 campo-local">
                        <label class="d-block">
                            <span class="form-label d-block">Origem</span>
                            <select name="localOrigemId" class="form-select">
                                <option
                                    th:each="o : ${form.opcoesOrigem}"
                                    th:value="${o.valor}"
                                    th:text="${o.texto}"
                                    th:selected="${o.selecionado}"></option>
                            </select>
                        </label>
                        <div class="bloco-outro-local mt-2">
                            <input
                                name="cidadeOrigem"
                                list="lista-cidades"
                                class="form-control mb-2"
                                placeholder="Cidade/UF (comece a digitar)"
                                th:value="${form.cidadeOrigem}">
                            <input
                                name="descricaoOrigem"
                                class="form-control"
                                maxlength="200"
                                placeholder="Endereco ou ponto de referencia (opcional)"
                                th:value="${form.descricaoOrigem}">
                        </div>
                    </div>

                    <div class="col-12 campo-local">
                        <label class="d-block">
                            <span class="form-label d-block">Destino</span>
                            <select name="localDestinoId" class="form-select">
                                <option
                                    th:each="o : ${form.opcoesDestino}"
                                    th:value="${o.valor}"
                                    th:text="${o.texto}"
                                    th:selected="${o.selecionado}"></option>
                            </select>
                        </label>
                        <div class="bloco-outro-local mt-2">
                            <input
                                name="cidadeDestino"
                                list="lista-cidades"
                                class="form-control mb-2"
                                placeholder="Cidade/UF (comece a digitar)"
                                th:value="${form.cidadeDestino}">
                            <input
                                name="descricaoDestino"
                                class="form-control"
                                maxlength="200"
                                placeholder="Endereco ou ponto de referencia (opcional)"
                                th:value="${form.descricaoDestino}">
                        </div>
                    </div>

                    <datalist id="lista-cidades">
                        <option th:each="cidade : ${form.cidades}" th:value="${cidade}"></option>
                    </datalist>

                    <label class="col-6">
                        <span class="form-label d-block">Data e horario de saida</span>
                        <input type="datetime-local" name="saida" class="form-control" required th:value="${form.saidaCampo}">
                    </label>

                    <label class="col-6">
                        <span class="form-label d-block">Retorno estimado</span>
                        <input type="datetime-local" name="retorno" class="form-control" required th:value="${form.retornoCampo}">
                    </label>

                    <!-- Replicar para outros dias: ate 5 datas, abre pelo collapse do Bootstrap -->
                    <div class="col-12">
                        <button type="button" class="btn btn-link p-0" data-bs-toggle="collapse" data-bs-target="#nova-replicar">
                            Deseja replicar esta viagem para outros dias?
                        </button>
                        <div id="nova-replicar" th:class="${form.classeReplicar}">
                            <div class="form-text mb-2">Mesmo horario de saida e de retorno, em ate 5 outros dias.</div>
                            <div class="row g-2">
                                <div class="col-6" th:each="dia : ${form.camposReplicar}">
                                    <input type="date" name="replicarDias" class="form-control form-control-sm" th:value="${dia}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <label class="col-6">
                        <span class="form-label d-block">Quantidade de passageiros</span>
                        <input type="number" name="qtdPassageiros" class="form-control" min="1" required th:value="${form.qtdPassageiros}">
                    </label>

                    <label class="col-6">
                        <span class="form-label d-block">Telefone de contato</span>
                        <input
                            type="tel"
                            name="telefone"
                            class="form-control"
                            maxlength="20"
                            placeholder="(62) 90000-0000"
                            required
                            th:value="${form.telefone}">
                    </label>

                    <label class="col-12">
                        <span class="form-label d-block">Observacoes</span>
                        <textarea name="observacoes" class="form-control" rows="3" maxlength="500" th:text="${form.observacoes}"></textarea>
                    </label>

                    <div class="col-12">
                        <label class="form-check">
                            <input type="checkbox" class="form-check-input" required>
                            <span class="form-check-label small">
                                Concordo em aguardar a disponibilidade da minha reserva. Sua reserva sera avaliada pelo
                                departamento de CALT - (Coordenacao de Logistica e Transporte) e avisado em seu e-mail
                                ou atraves deste sistema caso haja disponibilidade ou nao.
                            </span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button th:unless="${form.aberto}" type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <a th:if="${form.aberto}" th:href="${form.urlFechar}" class="btn btn-ovg-secundario">Cancelar</a>
                    <button type="submit" class="btn btn-ovg-principal">Enviar solicitacao</button>
                </div>
            </form>
        </div>
    </div>
    <div th:if="${form.aberto}" class="modal-backdrop fade show"></div>
</th:block>
