<!-- Pedacos comuns a todas as paginas. Cada pagina inclui o que precisa com
     th:replace="~{fragmentos/layout :: nome-do-pedaco}". -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

    <!-- ============ <head>: titulo da aba + CSS (css = arquivo extra da pagina, opcional) ============ -->
    <head th:fragment="head(titulo, css)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo} + ' - Central de Transportes'"></title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="/css/estilo.css" rel="stylesheet">
        <link th:if="${css}" th:href="${css}" rel="stylesheet">
    </head>

    <body>

        <!-- ============ Menu do topo (o ${menu} vem do LayoutAdvice) ============ -->
        <nav th:fragment="menu" class="navbar navbar-ovg navbar-dark mb-4">
            <div class="container">
                <a href="/calendario" class="navbar-brand">Central de Transportes &middot; OVG</a>

                <div class="d-flex gap-2">
                    <div class="dropdown">
                        <button type="button" class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" th:text="${menu.titulo}"></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li th:each="item : ${menu.itens}">
                                <a th:class="${item.classe}" th:href="${item.url}" th:text="${item.texto}"></a>
                            </li>
                        </ul>
                    </div>

                    <form method="post" action="/api/auth/logout">
                        <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- ============ Avisos depois de uma acao (vem do addFlashAttribute do controller) ============ -->
        <th:block th:fragment="avisos">
            <div th:if="${mensagem}" class="alert alert-success alert-dismissible" role="alert">
                <span th:text="${mensagem}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger alert-dismissible" role="alert">
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>

        <!-- ============ Paginacao de uma lista (paginacao = PaginacaoDTO) ============ -->
        <div th:fragment="paginacao(paginacao)" th:if="${!paginacao.itens.isEmpty()}" class="mt-3">
            <div class="d-flex gap-1 flex-wrap justify-content-center">
                <a th:each="item : ${paginacao.itens}" th:class="${item.classe}" th:href="${item.url}" th:text="${item.texto}"></a>
            </div>
            <div class="text-muted small text-center mt-1" th:text="${paginacao.legenda}"></div>
        </div>

        <!-- ============ JS do Bootstrap (so ele: abre/fecha modais e menus) ============ -->
        <script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
