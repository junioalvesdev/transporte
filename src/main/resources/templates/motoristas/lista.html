<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/layout :: head('Motoristas', null)}"></head>

    <!-- Pagina "Motoristas". Tudo vem pronto do Java em ${pagina}
         (controller/MotoristasController + service/MotoristasService). -->
    <body>
        <nav th:replace="~{fragmentos/layout :: menu}"></nav>

        <main class="container pb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 mb-0">Motoristas</h1>
                <button type="button" class="btn btn-ovg-principal btn-sm" data-bs-toggle="modal" data-bs-target="#modal-novo-motorista">
                    Novo motorista
                </button>
            </div>

            <th:block th:replace="~{fragmentos/layout :: avisos}"></th:block>

            <table class="table cartao align-middle">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${pagina.linhas}">
                        <td th:text="${m.nome}"></td>
                        <td th:text="${m.telefone}"></td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-ovg-secundario" data-bs-toggle="modal" th:data-bs-target="${m.alvoModalEditar}">
                                Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="${m.alvoModalInativar}">
                                Inativar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p th:if="${pagina.linhas.isEmpty()}" class="text-muted">Nenhum motorista cadastrado.</p>

            <div th:replace="~{fragmentos/layout :: paginacao(${pagina.paginacao})}"></div>
        </main>

        <!-- ============================== Modais ============================== -->
        <th:block th:replace="~{motoristas/modais/novo :: modal}"></th:block>
        <th:block th:replace="~{motoristas/modais/editar :: modais}"></th:block>
        <th:block th:replace="~{motoristas/modais/inativar :: modais}"></th:block>

        <script th:replace="~{fragmentos/layout :: scripts}"></script>
    </body>
</html>
