<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/layout :: head('Relatorios', null)}"></head>

    <!-- Pagina "Relatorios". Tudo vem pronto do Java em ${pagina}
         (controller/RelatoriosController + service/RelatoriosService).
         O grafico por mes e feito com a barra de progresso do Bootstrap. -->
    <body>
        <nav th:replace="~{fragmentos/layout :: menu}"></nav>

        <main class="container pb-5">
            <h1 class="h5 mb-3">Relatorios</h1>

            <!-- ============ Periodo: form GET comum, o resultado vem pela URL ============ -->
            <div class="cartao cartao-busca mb-4">
                <form method="get" action="/relatorios" class="row g-3 align-items-end">
                    <label class="col-md-4">
                        <span class="form-label d-block">De</span>
                        <input type="date" name="inicio" class="form-control" required th:value="${pagina.inicio}">
                    </label>
                    <label class="col-md-4">
                        <span class="form-label d-block">Ate</span>
                        <input type="date" name="fim" class="form-control" required th:value="${pagina.fim}">
                    </label>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-ovg-principal w-100">Gerar</button>
                    </div>
                </form>
            </div>

            <p class="h6">Total de viagens no periodo: <span th:text="${pagina.totalViagens}"></span></p>

            <div class="row g-4 mt-1">
                <!-- ============ Viagens por mes (grafico de barras) ============ -->
                <div class="col-md-6">
                    <div class="cartao p-3">
                        <h2 class="h6">Viagens por mes</h2>
                        <div th:each="barra : ${pagina.porMes}" class="d-flex align-items-center gap-2 mb-1 small">
                            <span class="text-muted" style="width: 60px" th:text="${barra.rotulo}"></span>
                            <div class="progress flex-grow-1" style="height: 18px">
                                <div class="progress-bar grafico-barra" th:style="${barra.estilo}"></div>
                            </div>
                            <span class="text-end" style="width: 40px" th:text="${barra.quantidade}"></span>
                        </div>
                        <p th:if="${pagina.porMes.isEmpty()}" class="text-muted small mb-0">Nenhuma viagem no periodo.</p>
                    </div>
                </div>

                <!-- ============ Tabelas de contagem ============ -->
                <div class="col-md-6">
                    <div class="cartao p-3">
                        <h2 class="h6">Viagens por status</h2>
                        <table class="table table-sm mb-0">
                            <tbody>
                                <tr th:each="c : ${pagina.porStatus}">
                                    <td th:text="${c.rotulo}"></td>
                                    <td class="text-end" th:text="${c.quantidade}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="cartao p-3">
                        <h2 class="h6">Viagens por motorista</h2>
                        <table class="table table-sm mb-0">
                            <tbody>
                                <tr th:each="c : ${pagina.porMotorista}">
                                    <td th:text="${c.rotulo}"></td>
                                    <td class="text-end" th:text="${c.quantidade}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="cartao p-3">
                        <h2 class="h6">Viagens por tipo de veiculo</h2>
                        <table class="table table-sm mb-0">
                            <tbody>
                                <tr th:each="c : ${pagina.porTipoVeiculo}">
                                    <td th:text="${c.rotulo}"></td>
                                    <td class="text-end" th:text="${c.quantidade}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <script th:replace="~{fragmentos/layout :: scripts}"></script>
    </body>
</html>
