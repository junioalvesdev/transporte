<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/layout :: head('Veiculos', null)}"></head>

    <!-- Pagina "Veiculos". Tudo vem pronto do Java em ${pagina}
         (controller/VeiculosController + service/VeiculosService). -->
    <body>
        <nav th:replace="~{fragmentos/layout :: menu}"></nav>

        <main class="container pb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 mb-0">Veiculos</h1>
                <button type="button" class="btn btn-ovg-principal btn-sm" data-bs-toggle="modal" data-bs-target="#modal-novo-veiculo">
                    Novo veiculo
                </button>
            </div>

            <th:block th:replace="~{fragmentos/layout :: avisos}"></th:block>

            <table class="table cartao align-middle">
                <thead>
                    <tr>
                        <th>Placa</th>
                        <th>Modelo</th>
                        <th>Capacidade</th>
                        <th>Tipo</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${pagina.linhas}">
                        <td th:text="${v.placa}"></td>
                        <td th:text="${v.modelo}"></td>
                        <td th:text="${v.capacidade}"></td>
                        <td>
                            <i th:class="${v.iconeTipo}"></i>
                            <span th:text="${v.tipo}"></span>
                        </td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-ovg-secundario" data-bs-toggle="modal" th:data-bs-target="${v.alvoModalEditar}">
                                Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="${v.alvoModalInativar}">
                                Inativar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p th:if="${pagina.linhas.isEmpty()}" class="text-muted">Nenhum veiculo cadastrado.</p>

            <div th:replace="~{fragmentos/layout :: paginacao(${pagina.paginacao})}"></div>
        </main>

        <!-- ============================== Modais ============================== -->
        <th:block th:replace="~{veiculos/modais/novo :: modal}"></th:block>
        <th:block th:replace="~{veiculos/modais/editar :: modais}"></th:block>
        <th:block th:replace="~{veiculos/modais/inativar :: modais}"></th:block>

        <script th:replace="~{fragmentos/layout :: scripts}"></script>
    </body>
</html>
