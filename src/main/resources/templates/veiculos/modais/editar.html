<!-- Modais "Editar veiculo": um por veiculo da tabela, ja preenchido.
     A placa e a chave do veiculo e nao pode mudar (vai escondida no form).
     Incluido em veiculos/lista.html. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="modais">
    <div th:each="v : ${pagina.linhas}" th:id="${v.modalEditarId}" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="${v.urlEditar}">
                <input type="hidden" name="pagina" th:value="${pagina.paginaAtual}">
                <input type="hidden" name="placa" th:value="${v.placa}">

                <div class="modal-header">
                    <h5 class="modal-title" th:text="${v.tituloEditar}"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body row g-3">
                    <label class="col-6">
                        <span class="form-label d-block">Placa</span>
                        <input class="form-control" th:value="${v.placa}" disabled>
                    </label>

                    <label class="col-6">
                        <span class="form-label d-block">Capacidade</span>
                        <input type="number" name="capacidade" min="1" class="form-control" required th:value="${v.capacidade}">
                    </label>

                    <label class="col-12">
                        <span class="form-label d-block">Modelo</span>
                        <input name="modelo" class="form-control" required th:value="${v.modelo}">
                    </label>

                    <label class="col-12">
                        <span class="form-label d-block">Tipo</span>
                        <select name="tipoVeiculoId" class="form-select" required>
                            <option th:each="o : ${v.tipos}" th:value="${o.valor}" th:text="${o.texto}" th:selected="${o.selecionado}"></option>
                        </select>
                    </label>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-ovg-secundario" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-ovg-principal">Salvar alteracoes</button>
                </div>
            </form>
        </div>
    </div>
</th:block>
