# Publica uma versao nova a cada push na main:
#   1. gera a imagem pelo Dockerfile e publica em
#      ghcr.io/junioalvesdev/transporte-app:1.<numero da execucao>
#   2. troca a linha "image:" do docker-stack.portainer.yml pra essa tag e
#      faz commit — o Portainer ve esse commit e atualiza a stack sozinho.
# O commit feito aqui usa o GITHUB_TOKEN, que nao dispara o workflow de novo.
name: Publicar

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docker-compose*.yml"
  workflow_dispatch:

# duas publicacoes nunca rodam ao mesmo tempo (a segunda espera a primeira)
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write   # commit da tag nova no docker-stack.portainer.yml
  packages: write   # publicar no ghcr.io

env:
  IMAGEM: ghcr.io/junioalvesdev/transporte-app

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag desta versao
        run: echo "TAG=1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ env.TAG }}
            ${{ env.IMAGEM }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Apontar a stack pra versao nova
        run: |
          sed -i "s#image: ${IMAGEM}:.*#image: ${IMAGEM}:${TAG}#" docker-stack.portainer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-stack.portainer.yml
          git commit -m "Publica a versao ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
